services:
  # Backend Web Service for Render
  - type: web
    name: battery-register-backend
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      # Optional: To connect Render PostgreSQL, create a Database on Render and set DATABASE_URL
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: battery-db
      #     property: connectionString

# Optional: Render Managed PostgreSQL Database (Free tier available on Render)
databases:
  - name: battery-db
    plan: free
    databaseName: battery_stock
    user: battery_admin
